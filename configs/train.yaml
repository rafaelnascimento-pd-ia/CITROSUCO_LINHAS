# Configuração para fluxo de treinamento
# Use: python main.py train --config configs/train.yaml

gpkg_path: data_set/63996/63996.gpkg
lines_path: data_set/63996/VETORES/LINHAS.geojson
talhao_path: data_set/63996/VETORES/TALHOES.geojson

data_dir: data
models_dir: models
output_dir: data

encoder_name: resnet18
epochs: 60
batch_size: 16
lr: 0.0001
early_stopping_patience: 20
min_delta: 0.001

buffer_size: 1.37
tile_size: 256
stride: 128
val_size: 0.15
test_size: 0.05
append: false
