# Fluxo completo para o dataset 68093 (curvas).
# Uso: python main.py resultado --config configs/resultado.yaml

gpkg_path: inferencia/68093/68093.gpkg
talhao_path: inferencia/68093/68093.geojson

data_dir: data
models_dir: models
checkpoint_path: models/best_model_20260901_203143_9orthos.pth
output_dir: inferencia_teste_rafael_1/68093/resultado
lines_output_name: LINHAS_68093
route_output_name: ROTA_BORDADURA_68093
max_line_vertices: 80
line_simplify_tolerance_m: 0.1
route_smoothing_radius_m: 0.5
route_smoothing_min_turn_deg: 15.0
route_simplify_tolerance_m: 0.035
max_boundary_vertices: 100
boundary_simplify_tolerance_m: 0.1

tile_size: 256
stride: 128
threshold: 0.35
min_area_m2: 5.0
close_size: 7
open_size: 2
skip_postprocess: false
export_as_lines: true
profile: curva
calc_entrelinhas: true
min_row_spacing_m: 4.0
max_row_spacing_m: 8.5

# MDT informado para a geração da bordadura.
mdt_path: Gerar_bordadura/MDT.tif
bordadura_buffer_distance: 7.0
