# Inferência SEM pós-processamento — exporta polígonos brutos da I.A.
# Use: python main.py infer_post --config configs/infer_raw.yaml
# Útil para diagnosticar se o problema está no modelo ou no pós-processamento.

gpkg_path: inferencia/76979/76979.gpkg
talhao_path: inferencia/76979/talhoes2.geojson
checkpoint_path: models/best_model_20260531_180150.pth
path_linhas: inferencia/76979/sentido_linhas_teste.geojson

data_dir: data
output_dir: inferencia/76979_raw

tile_size: 256
stride: 64

threshold: 0.40
min_area_m2: 2.0        # Baixo para não filtrar nada — ver tudo que o modelo detectou
close_size: 0           # Sem fechamento morfológico
open_size: 0            # Sem abertura morfológica
skip_postprocess: true  # Pula TODOS os filtros morfológicos
export_as_lines: false  # Exporta polígonos brutos (não extrai linhas centrais)
min_row_spacing_m: 0.0  # Sem deduplicação
