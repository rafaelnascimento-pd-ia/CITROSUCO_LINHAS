# Configuração para inferência em lote (infer_batch) SEM pós-processamento (Máscaras Brutas)
# Use: python main.py infer_batch --config configs/infer_batch_raw.yaml

checkpoint_path: models/best_model_20260531_180150.pth

# Parâmetros padrão gerais para máscara bruta (sem pós-processamento ou esqueletização)
tile_size: 256
stride: 64
threshold: 0.40
min_area_m2: 2.0        # Baixo para ver tudo o que o modelo detectou
close_size: 0           # Sem fechamento morfológico
open_size: 0            # Sem abertura morfológica
skip_postprocess: true  # Pula TODOS os filtros morfológicos
export_as_lines: false  # Exporta os polígonos brutos (não extrai linhas centrais)
min_row_spacing_m: 0.0  # Sem deduplicação por proximidade

runs:
  - gpkg_path: inferencia/76979/76979.gpkg
    talhao_path: inferencia/76979/79.geojson
    output_dir: inferencia/76979_raw

  - gpkg_path: inferencia/76983/76983.gpkg
    talhao_path: inferencia/76983/TALHOES.geojson
    output_dir: inferencia/76983_raw
