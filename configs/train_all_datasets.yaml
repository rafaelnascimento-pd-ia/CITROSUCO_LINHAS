# Parâmetros de Pré-Processamento
data_dir: data
models_dir: models
buffer_size: 1.3
tile_size: 256
stride: 128
val_size: 0.15   # 15% para Validação (salvar best_model)
test_size: 0.05  # 5% para Teste Cego (avaliação final) -> Restante 80% para Treino
skip_preprocess: false # Gera os tiles de treino/val/teste a partir dos 9 ortomosaicos

# Configuração do Treinamento
encoder_name: resnet18
epochs: 60
batch_size: 16
lr: 0.0001
early_stopping_patience: 20  # Para automaticamente se ficar 20 épocas sem ganho significativo
min_delta: 0.001             # Ganho mínimo necessário no Val IoU (+0.1%)

